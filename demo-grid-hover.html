<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid et hover</title>
    <style>
        .grid{
            font-family: sans-serif;
            display: grid;
            grid-template-columns: repeat(2,300px);
        }
        .item-grid{
            display: grid;
        }
        .item-grid img,
        .item-grid h2{
            grid-column: 1/-1;
            grid-row: 1/-1;
        }

        .item-grid h2{
            color:#fff;
            background: #0000008a;
            margin: 0;
            opacity:0;
            transition: .4s;
            display: grid;
            align-items:center;
            justify-items: center;
        }
        .item-grid:hover h2{
            opacity:1;
        }

    </style>
</head>
<body>
    <h1>demo</h1>
    <div class="grid">
        <div class="item-grid">
            <img src="https://picsum.photos/id/237/300/300" alt="chien">
            <h2>Chien</h2>
        </div>
        <div class="item-grid">
            <img src="https://picsum.photos/id/230/300/300" alt="chien">
            <h2>Pas Chien</h2>
        </div>
    </div>
</body>
</html>
