<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo responsive sans media queries</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(auto-fill,320px);
            justify-content: center;
            gap:24px;
          } 
          h1{
            font-size:clamp(18px,4vw,48px);
          }
          p{
            max-width: 380px;
          }
        </style>
</head>
<body>
    <h1>Demo responsive</h1>
    <p>This is a simple demo of a responsive webpage. Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
</body>
</html>
