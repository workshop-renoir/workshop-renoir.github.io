<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Nino</title>
    <style>
        body{
            background:#ccc;
        }
        .button{
            background:#fff;
            color:#000;
            text-decoration: none;
            border:1px solid #000;
            padding:8px 10px;
            border-radius:15px;
            transition: 0.5s background;
        }
        .button:hover{
            background:#ddd;
        }
    </style>
</head>
<body>
    <a class="button" href="#">Sauce-piquante</a>
    <a class="button" href="#">Grille</a>
    <a class="button" href="#">Kabane Café</a>
</body>
</html>
